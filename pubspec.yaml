name: kid_puzzle
description: "幼兒益智遊戲"
publish_to: "none"
version: 0.3.3+13

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 狀態管理
  provider: ^6.1.2

  # 音效與語音（語音改走預先合成的 mp3，見 tools/generate_voice.py）
  audioplayers: ^6.1.0
  # web 平台直接走 Web Audio API（iOS Safari 上 <audio> element 連續切檔
  # 會吐解碼雜訊、且 setSrc 中間狀態被打斷會吞音）
  web: ^1.1.0

  # 圖庫匯入
  image_picker: ^1.1.2
  image: ^4.2.0

  # 儲存（hive_ce 為社群維護分支，與原 hive API 相容且追新 source_gen）
  hive_ce: ^2.10.1
  hive_ce_flutter: ^2.2.0
  path_provider: ^2.1.4

  # 工具
  uuid: ^4.5.1
  archive: ^4.0.2
  file_picker: ^13.3.2
  url_launcher: ^6.3.0
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # 動畫
  flutter_animate: ^4.5.0
  showcaseview: ^5.0.2

  # Firebase Analytics（跨平台事件追蹤；Android/iOS/Web 共用同一 API）
  firebase_core: ^4.9.0
  firebase_analytics: ^12.4.1
  package_info_plus: ^10.2.2

  # 3D（數數看）：flutter_scene 釘死版本，因為 assets/models/*.fsceneb 是在姊妹專案
  # kid-puzzle-3d-assets 預先轉好的，格式跟這個版本綁定；升級時兩邊一起升、重新轉檔。
  # hooks 給 hook/build.dart 用（編譯材質與描邊 shader）。
  flutter_scene: 0.24.3
  vector_math: ^2.4.4
  hooks: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  freezed: ^3.0.4
  json_serializable: ^6.8.0
  hive_ce_generator: ^1.9.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/puzzles/
    - assets/images/ui/
    - assets/images/sprites/
    - assets/audio/
    - assets/audio/voice/
    - assets/audio/voice/counting/
    - assets/audio/sprites/
    - assets/data/
    # 3D 模型（.fsceneb）、材質、描邊 shader：不直接打包，由 hook/build.dart 寫進
    # flutter_scene_generated/，程式以原始路徑（assets/models/...）載入
    - flutter_scene_generated/
    - path: flutter_scene_generated/metal_ios/
      platforms:
        - ios
    - path: flutter_scene_generated/metal_desktop/
      platforms:
        - macos
    - path: flutter_scene_generated/opengl_es_vulkan/
      platforms:
        - android
        - linux
        - windows
    - path: flutter_scene_generated/opengl_es/
      platforms:
        - web
