# 靜態分析設定：以 flutter_lints 為基底加上專案規則
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # 字串一律使用雙引號
    prefer_double_quotes: true
    prefer_single_quotes: false
    # 多行集合與引數列表結尾加逗號
    require_trailing_commas: true
    # 使用 super 參數簡化建構子
    use_super_parameters: true
    # 不要省略 ; 結尾
    always_put_control_body_on_new_line: false
    # 區域變數能 final 就 final（減少誤改）
    prefer_final_locals: true
    prefer_final_in_for_each: true
    # 漏 await / 沒明確 fire-and-forget 的 Future 要警告
    unawaited_futures: true
    # StreamSubscription 必須 cancel、StreamController 必須 close
    cancel_subscriptions: true
    close_sinks: true
    # async gap 後使用 BuildContext 要先檢查 mounted
    use_build_context_synchronously: true
    # 別 return null 在 void function
    avoid_returning_null_for_void: true
    # 不准改 parameter 變數
    parameter_assignments: true

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
  errors:
    # generator 產生的 deprecated 警告會被排除（已在 exclude）
    invalid_annotation_target: ignore
