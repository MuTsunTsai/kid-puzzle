# 自動建置並部署 Flutter web 版到 GitHub Pages
# 部署網址：https://mutsuntsai.github.io/kid-puzzle/
name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Flutter 版本鎖定：與本地開發環境一致，避免雲端抓到比本地新的版本後
      # 造成行為差異。升級本地後一併把這裡 bump。
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.0"
          cache: true

      # 快取 Flutter build 中間產物（dill / kernel / 生成檔），
      # web build 第二次起省約 30~60 秒。pubspec.lock 變動就 invalidate。
      - name: Cache .dart_tool
        uses: actions/cache@v4
        with:
          path: .dart_tool
          key: dart-tool-web-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            dart-tool-web-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      # base-href 結尾必須有斜線；對應 repo 名稱 kid-puzzle
      - name: Build web
        run: flutter build web --wasm --release --base-href /kid-puzzle/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
