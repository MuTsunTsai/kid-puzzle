<!DOCTYPE html>
<html lang="zh-Hant">
<head>
	<meta charset="UTF-8">
	<title>gallery</title>
	<style>
		* {
			box-sizing: border-box;
		}
		body {
			margin: 0;
			padding: 12px;
			background: #1e1e1e;
		}
		.grid {
			display: grid;
			grid-template-columns: repeat(5, 1fr);
			gap: 12px;
		}
		.grid img {
			width: 100%;
			aspect-ratio: 4 / 3;
			object-fit: contain;
			display: block;
			border-radius: 8px;
		}
	</style>
</head>
<body>
